<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Refrescaña — Productos Naturales de la Selva Peruana</title>
    <link rel="icon" type="image/webp" href="/logo/logo.webp" />
    <meta name="description" content="Productos naturales artesanales de alta pureza: jarabes, aceites esenciales, harinas y derivados de la caña. Bienestar, nutrición y cuidado personal." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --font-display: 'Playfair Display';
        --font-serif: 'Lora';
        --font-body: 'DM Sans';
      }
    </style>
  </head>
  <body>
    <!--
      Cortina estática — presente desde el primer byte antes de que React monte.
      El inline script la oculta inmediatamente en visitas de retorno (antes del primer paint).
    -->
    <div
      id="preloader-curtain"
      style="position:fixed;inset:0;z-index:9997;background-color:#F5F5F2;pointer-events:none"
    ></div>
    <script>try{var s=sessionStorage.getItem('refrescana-preloader-shown');var m=window.matchMedia('(prefers-reduced-motion: reduce)').matches;if(s||m){document.getElementById('preloader-curtain').style.display='none';}else{document.body.style.overflow='hidden';}}catch(e){}</script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
